[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "myata"
version = "0.4.5"
description = "Offline voice assistant that understands Russian"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0",                                       # screenshots (Windows, Linux X11)
    "numpy>=1.26",
    "ollama>=0.6",
    "pycaw>=20251023; sys_platform == 'win32'",       # volume on Windows
    "pymorphy3>=2.0",                                 # word forms for the fast router
    "pyttsx3>=2.90",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Install torch from the CPU index first, see README:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
voice = [
    "faster-whisper>=1.2",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
    "num2words>=0.5.13",
    "scipy>=1.11",          # needed inside the Silero v5_ru model package
    "sounddevice>=0.4.6",
    "torch>=2.4",
    "vosk>=0.3.45",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
myata = "myata.__main__:main"

[tool.setuptools.packages.find]
include = ["myata*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
