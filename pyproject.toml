[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "myata"
version = "0.2.0"
description = "Offline voice assistant that understands Russian"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6",
    "pyyaml>=6.0",
    "pyttsx3>=2.90",
    "sounddevice>=0.4.6",
    "vosk>=0.3.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
myata = "myata.__main__:main"

[tool.setuptools.packages.find]
include = ["myata*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
