# Myata configuration.
# Phrases are in Russian because Myata talks Russian. Everything else is plain settings.

assistant:
  name: Мята
  listen_window_sec: 6        # how long to wait for a command after a bare "Мята"
  confirm_timeout_sec: 15     # how long to wait for "да" / "нет" before a dangerous action
  yes_words: [да, подтверждаю, конечно, давай, ага, точно]
  no_words: [нет, отмена, отмени, не]
  phrases:
    greeting: Мята на связи
    listening: Слушаю
    not_understood: Не поняла команду
    goodbye: До связи, сэр
    failed: Не получилось, сэр
    confirm: Вы уверены, сэр? Скажите да или нет.
    cancelled: Отменяю
    brain_offline: Мой мозг сейчас не отвечает, сэр.

# Wake word. Vosk listens only for these words (grammar), then Whisper must also hear one
# of them (fuzzy match, threshold below), otherwise the phrase is a false alarm.
wake:
  words: [мята]
  threshold: 0.85             # 0.75 let "мать" through
  vosk_model_path: models/vosk-model-small-ru-0.22
  preroll_sec: 1.0            # audio kept before the wake word fired

# Fast path: commands that clearly match an example phrase run instantly without the LLM.
router:
  threshold: 0.75             # 1.0 = every word of the phrase found and nothing extra
  stop_words: [пожалуйста, мне, ка, там, сейчас, а, ну, и]

llm:
  enabled: true
  host: http://localhost:11434
  model: qwen3.5:4b           # 8 GB VRAM: qwen3:8b also fits next to whisper
  think: false                # thinking makes every answer several seconds slower
  temperature: 0.6
  num_ctx: 4096
  max_tokens: 256             # hard limit for one answer, stops a looping model
  keep_alive: 30m             # keep the model in VRAM between commands
  timeout_sec: 60
  max_reply_chars: 300
  history_turns: 6            # how many past exchanges the LLM sees
  history_ttl_sec: 300        # forget the dialog after 5 minutes of silence
  # Placeholders: {name}, {date}, {time}
  system_prompt: |
    Ты {name}, голосовой ассистент в стиле Джарвиса из фильма «Железный человек».
    Ты вежливая, спокойная и немного ироничная. О себе говоришь в женском роде.
    Обращайся к пользователю «сэр».
    Отвечай по-русски, коротко: одно или два предложения.
    Твой ответ будет озвучен голосом.
    Поэтому не используй markdown, списки, эмодзи, ссылки и код.
    Если пользователь просит что-то сделать и для этого есть инструмент, вызови инструмент.
    Никогда не говори, что выполнила действие, если не вызвала инструмент.
    Если подходящего инструмента нет, честно скажи, что пока так не умеешь.
    Сегодня {date}, сейчас {time}.

audio:
  sample_rate: 16000          # must be 16000 for Silero VAD and Whisper
  block_size: 1600            # 100 ms per microphone block
  device: null                # microphone, null = default (see: python -m myata --list-devices)
  output_device: null         # speakers for the Silero voice, null = default
  unmute_delay_sec: 0.2       # wait after Myata speaks, so she does not hear her own echo

# End of phrase detection (Silero VAD)
vad:
  model_path: models/silero/silero_vad.jit
  threshold: 0.5              # speech probability for one 32 ms frame
  silence_ms: 700             # this much silence ends the phrase
  min_speech_ms: 200          # shorter sounds are treated as noise
  start_timeout_sec: 5        # after the wake word: give up if nothing is said
  max_phrase_sec: 15

# Speech recognition (faster-whisper)
stt:
  model: models/whisper-large-v3-turbo   # local folder, or a name like large-v3-turbo
  download_root: models/whisper          # where named models are downloaded
  device: cuda                # cuda | cpu
  compute_type: int8_float16  # about 1.5 GB of VRAM for large-v3-turbo
  cpu_compute_type: int8
  cpu_fallback: true          # switch to CPU if CUDA does not start
  language: ru
  beam_size: 5                # 1 is a bit faster, 5 is a bit more accurate
  initial_prompt: null        # e.g. "Мята, открой ютуб, запусти дискорд." to bias the vocabulary
  hallucinations:             # phrases Whisper invents on noise; such results are dropped
    - продолжение следует
    - субтитры сделал
    - субтитры создавал
    - редактор субтитров
    - спасибо за просмотр
    - подписывайтесь на канал
    - dimatorzok

# Speech synthesis
tts:
  engine: silero              # silero | pyttsx3 | none (pyttsx3 is also the automatic fallback)
  silero:
    model_path: models/silero/v5_ru.pt   # licence CC BY-NC 4.0
    speaker: xenia            # aidar, baya, kseniya, xenia, eugene
    sample_rate: 48000        # 8000 | 24000 | 48000
    threads: 4                # CPU threads for synthesis
    put_accent: true
    put_yo: true
    put_stress_homo: true
    put_yo_homo: true
  pyttsx3:
    rate: 180
    voice_hints: [ru, irina, russian]
  # Silero reads only Cyrillic: Latin words are replaced before speaking.
  replacements:
    VS Code: вэ эс код
    YouTube: ютуб
    Discord: дискорд
    Steam: стим
    Chrome: хром
    Google: гугл
    Windows: виндоус
    Linux: линукс
    League of Legends: лига легенд
    LLM: эл эл эм
    Ollama: оллама

logging:
  level: INFO                 # level for the log file
  console_level: WARNING      # level for the console (--debug sets DEBUG)
  file: logs/myata.log

# Websites. One entry = one skill. The description is what the LLM sees.
sites:
  - name: youtube
    url: https://youtube.com
    phrases: [открой ютуб, включи ютуб]
    reply: Открываю ютуб
    description: Open the YouTube main page (ютуб)

# Applications. A command is a list of arguments for each OS.
# If an app has no command for the current OS, the skill is simply not registered.
# Single quotes keep Windows backslashes as they are. %VAR% and ~ are expanded.
apps:
  - name: league_of_legends
    phrases: [открой лигу легенд, запусти лигу легенд, запусти лигу]
    reply: Запускаю Лигу Легенд, сэр
    description: Launch the game League of Legends (лига легенд, лол)
    commands:
      windows: ['C:\Riot Games\Riot Client\RiotClientServices.exe',
                --launch-product=league_of_legends, --launch-patchline=live]

  - name: browser
    phrases: [открой браузер, запусти браузер]
    reply: Открываю браузер
    description: Open the web browser Google Chrome (браузер, хром)
    commands:
      windows: [chrome]
      linux: [google-chrome]

  - name: file_manager
    phrases: [открой проводник]
    reply: Открываю проводник
    description: Open the file manager (проводник, файлы)
    commands:
      windows: [explorer]
      linux: [xdg-open, '~']

  - name: notepad
    phrases: [открой блокнот]
    reply: Открываю блокнот
    description: Open a simple text editor (блокнот)
    commands:
      windows: [notepad]
      linux: [xed]

  - name: steam
    phrases: [открой стим, запусти стим]
    reply: Запускаю стим
    description: Launch Steam, the game store and launcher (стим)
    commands:
      windows: ['%ProgramFiles(x86)%\Steam\steam.exe']
      linux: [steam]

  - name: discord
    phrases: [открой дискорд, запусти дискорд]
    reply: Открываю дискорд
    description: Launch Discord, the voice chat and messenger (дискорд)
    commands:
      windows: ['%LOCALAPPDATA%\Discord\Update.exe', --processStart, Discord.exe]
      linux: [discord]

  - name: vscode
    phrases: [открой вс код, открой вэ эс код, открой визуал студио код]
    reply: Открываю VS Code
    description: Launch the code editor Visual Studio Code (вс код, редактор кода)
    commands:
      windows: ['%LOCALAPPDATA%\Programs\Microsoft VS Code\Code.exe']
      linux: [code]
